services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowns-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - knowns-qdrant-storage:/qdrant/storage

volumes:
  knowns-qdrant-storage:
    external: true
    name: knowns-qdrant-storage
